# CoolShark 商城 Nginx 配置
# 用途：前端 SPA + API 反向代理 + 静态图片服务 + SSE 流式
# 部署路径：/etc/nginx/conf.d/csmall.conf

server {
    listen 80;
    server_name localhost;

    # Gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # SSE 流式路径：关闭缓冲（必须在通用 /ai/ 之前精确匹配）
    location = /ai/chat/stream {
        proxy_pass http://mall-gateway:10087;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Gateway 代理（内部跳转用）
    location @gateway {
        proxy_pass http://mall-gateway:10087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard：Accept JSON → Gateway API，否则 → SPA index.html
    location = /admin/dashboard {
        error_page 418 = @gateway;
        if ($http_accept ~* "application/json") {
            return 418;
        }
        rewrite ^ /index.html last;
    }

    # Admin 后台管理其余 SPA 页面路径
    location ~ ^/admin/ {
        if ($request_method = GET) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://mall-gateway:10087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/ 前缀路由 → 剥离前缀后转发 Gateway
    location ~ ^/api/(admin|sso|oms|front|seckill|ai|search|user|ums|pms|resource|ams)/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://mall-gateway:10087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 所有 API 路径统一代理到 Gateway
    location ~ ^/(admin|sso|oms|front|seckill|ai|search|user|ums|pms|resource|ams)/ {
        proxy_pass http://mall-gateway:10087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 文件上传（需要更大的请求体）
    location /upload/ {
        proxy_pass http://mall-gateway:10087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
    }

    # 静态图片（由 Nginx 直接从磁盘提供，不经过 Java 服务栈）
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        root /data/csmall-upload;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 前端 SPA（Vue History 模式）
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
