# CoolShark 商城 Nginx 配置
# 用途：前端 SPA + API 反向代理 + 静态图片服务
# 部署路径：/etc/nginx/conf.d/csmall.conf

server {
    listen 80;
    server_name localhost;

    # Gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # 前端 SPA（Vue History 模式）
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # 静态图片（由 Nginx 直接从磁盘提供，不经过 Java 服务栈）
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        root /data/csmall-upload;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理 → Gateway（10087）
    location /api/ {
        proxy_pass http://127.0.0.1:10087/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 文件上传（需要更大的请求体）
    location /upload/ {
        proxy_pass http://127.0.0.1:10087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
    }
}
